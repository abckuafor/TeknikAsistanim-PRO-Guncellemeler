name: Review and publish 1.10.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review1104.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact EXE and ZIP, verify unified status window
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          New-Item -ItemType Directory $dir -Force | Out-Null
          $result=[ordered]@{verdict='NOT_SCANNED'; errors=@(); exeExecuted=$false; startupVerified=$false}
          $app=$null
          try {
            if ((Get-Service WinDefend).Status -ne 'Running') { Start-Service WinDefend -ErrorAction Stop }
            Update-MpSignature -ErrorAction Stop
            $status=Get-MpComputerStatus
            $result.defenderVersion=$status.AMProductVersion
            $result.signatureVersion=$status.AntivirusSignatureVersion
            $result.signatureUpdatedUtc=$status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o')
            if (!$status.AMServiceEnabled -or $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-3)) { throw 'Defender or current signatures unavailable' }
            $folder=Join-Path $dir 'application'; New-Item -ItemType Directory $folder -Force | Out-Null
            New-Item -ItemType Directory (Join-Path $folder 'Data'),(Join-Path $folder 'Drivers') -Force|Out-Null
            [IO.File]::WriteAllText((Join-Path $folder 'Data/fixture-preserve.txt'),'synthetic-keep-data')
            [IO.File]::WriteAllText((Join-Path $folder 'Drivers/fixture-preserve.txt'),'synthetic-keep-drivers')
            $exe=Join-Path $folder 'TeknikServis_PRO.exe'
            $stream=[IO.File]::Create($exe)
            try { Get-ChildItem 'binaries/parts/*.part' | Sort-Object Name | ForEach-Object { $f=[IO.File]::OpenRead($_.FullName);try{$f.CopyTo($stream)}finally{$f.Dispose()} } } finally { $stream.Dispose() }
            $expected=((Get-Content 'binaries/SHA256.txt') -split ' ')[0].ToLowerInvariant()
            $result.exeSha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if($result.exeSha256 -ne $expected){throw 'EXE hash mismatch'}
            $zip=Join-Path $dir 'TeknikServis_PRO_1.10.4_EXE.zip'
            Compress-Archive $exe $zip
            $result.zipSha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $engine=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $engine.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object "$dir/scan-exe.txt"
            $result.exeScanExitCode=$LASTEXITCODE
            if($LASTEXITCODE -ne 0){throw 'EXE scan did not succeed'}
            & $engine.FullName -Scan -ScanType 3 -File $zip -DisableRemediation 2>&1 | Tee-Object "$dir/scan-original-zip.txt"
            $result.scanExitCode=$LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { $result.verdict='DETECTED_OR_SCAN_ERROR'; throw 'Original archive scan did not succeed' }
            $result.verdict='NO_DETECTION_IN_THIS_ENVIRONMENT'
            $app=Start-Process $exe -WorkingDirectory $folder -PassThru
            $result.exeExecuted=$true
            for ($i=0;$i -lt 30;$i++) {
              Start-Sleep -Seconds 1; $app.Refresh()
              if ($app.HasExited) { throw "Application exited before startup verification: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -like 'Teknik Servis PRO 1.10.4*') { $result.startupVerified=$true; $result.windowTitle=$app.MainWindowTitle; break }
            }
            if (!$result.startupVerified) {
              Add-Type -AssemblyName UIAutomationClient
              Add-Type -AssemblyName UIAutomationTypes
              $failureWindow=[Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
              $result.startupDialogText=@($failureWindow.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)|ForEach-Object {$_.Current.Name})
              throw "Main WPF window not verified: $($app.MainWindowTitle)"
            }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            Add-Type 'using System; using System.Runtime.InteropServices; public static class NoticeCloser { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra); public delegate bool ChildProc(IntPtr h,IntPtr p); [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,ChildProc callback,IntPtr p); [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,System.Text.StringBuilder name,int max); [DllImport("user32.dll")] public static extern int GetDlgCtrlID(IntPtr h); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); public static IntPtr FileNameEdit(IntPtr h){IntPtr last=IntPtr.Zero,preferred=IntPtr.Zero;EnumChildWindows(h,(child,p)=>{var name=new System.Text.StringBuilder(256);GetClassName(child,name,256);if(name.ToString()=="Edit"&&IsWindowVisible(child)){last=child;if(GetDlgCtrlID(child)==1001||GetDlgCtrlID(child)==1148)preferred=child;}return true;},IntPtr.Zero);return preferred!=IntPtr.Zero?preferred:last;} [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window,uint message,IntPtr wParam,IntPtr lParam); [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h,int id); [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,uint message,IntPtr wParam,string text); [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr h,uint cmd); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr window,int index); }'
            $scope=[Windows.Automation.TreeScope]::Descendants
            function FindNamed($parent,[string]$name,$kind) {
              $c=[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,$name),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,$kind))
              return $parent.FindFirst($scope,$c)
            }
            function FindWindow([string]$name) {
              $c=[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,$name),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id))
              for($j=0;$j -lt 120;$j++){$found=[Windows.Automation.AutomationElement]::RootElement.FindFirst($scope,$c);if($found){return $found};Start-Sleep -Milliseconds 250}
              throw "Dialog not found: $name"
            }
            function Click($parent,[string]$name) {
              $b=FindNamed $parent $name ([Windows.Automation.ControlType]::Button)
              if(!$b){throw "Button missing: $name"}
              ([Windows.Automation.InvokePattern]$b.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            }
            function CheckModern($window) {
              $close=$window.FindFirst($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'DialogClose'))
              if(!$close){throw 'Custom dialog close control missing'}
              $style=[NoticeCloser]::GetWindowLong([IntPtr]$window.Current.NativeWindowHandle,-16)
              $result.customChromeVerified=$true
            }
            $root=[Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            function ById($parent,[string]$id){return $parent.FindFirst($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,$id))}
            Add-Type -AssemblyName System.Drawing
            function Screenshot($window,[string]$name) {
              $bounds=$window.Current.BoundingRectangle
              $image=[Drawing.Bitmap]::new([int]$bounds.Width,[int]$bounds.Height);$graphics=[Drawing.Graphics]::FromImage($image);$graphics.CopyFromScreen([int]$bounds.X,[int]$bounds.Y,0,0,$image.Size)
              $image.Save((Join-Path $dir $name),[Drawing.Imaging.ImageFormat]::Png);$graphics.Dispose();$image.Dispose()
            }
            function CloseWindow($window){[NoticeCloser]::PostMessage([IntPtr]$window.Current.NativeWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)|Out-Null;Start-Sleep -Milliseconds 300}
            function WaitDone($window){for($j=0;$j -lt 480;$j++){if((ById $window 'OperationState').Current.Name -and (ById $window 'OperationState').Current.Name -ne 'İşlem devam ediyor'){return};Start-Sleep -Milliseconds 250};throw 'Bounded read-only operation did not finish'}
            Add-Type -AssemblyName System.Windows.Forms
            function SelectTab([string]$name){$tab=FindNamed $root $name ([Windows.Automation.ControlType]::TabItem);if(!$tab){throw "Tab missing: $name"};([Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 250}
            function ProcessWindows{ return [Windows.Automation.AutomationElement]::RootElement.FindAll($scope,[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window))) }
            function AssertNoProgress{if((ProcessWindows|Where-Object {$_.Current.Name -eq 'İşlem Durumu'}).Count){throw 'Picker spawned operation/progress window'}}
            function CancelNative($picker,[string]$method){if($method -eq 'Esc'){[NoticeCloser]::SetForegroundWindow([IntPtr]$picker.Current.NativeWindowHandle)|Out-Null;[Windows.Forms.SendKeys]::SendWait('{ESC}')}elseif($method -eq 'Cancel'){$button=FindNamed $picker 'Cancel' ([Windows.Automation.ControlType]::Button);if(!$button){$button=FindNamed $picker 'İptal' ([Windows.Automation.ControlType]::Button)};if($button){([Windows.Automation.InvokePattern]$button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()}else{$cancel=[NoticeCloser]::GetDlgItem([IntPtr]$picker.Current.NativeWindowHandle,2);if($cancel -eq [IntPtr]::Zero){throw 'Native Cancel ID missing'};[NoticeCloser]::PostMessage($cancel,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)|Out-Null}}else{CloseWindow $picker};Start-Sleep -Milliseconds 500;if(!$root.Current.IsEnabled){throw 'Main owner remained disabled after picker closed'};AssertNoProgress}
            function NativePath($picker,[string]$path,[string]$buttonName,[bool]$allowWork=$false){$edits=$picker.FindAll($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Edit));$field=$edits|Where-Object {$_.Current.Name -match '^(File name|Folder|Dosya adı|Klasör)'}|Select-Object -First 1;if($field){([Windows.Automation.ValuePattern]$field.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern)).SetValue($path)}else{$edit=[NoticeCloser]::FileNameEdit([IntPtr]$picker.Current.NativeWindowHandle);if($edit -eq [IntPtr]::Zero){throw 'Native filename control missing'};[NoticeCloser]::SendMessage($edit,0x000C,[IntPtr]::Zero,$path)|Out-Null};$accept=[NoticeCloser]::GetDlgItem([IntPtr]$picker.Current.NativeWindowHandle,1);if($accept -eq [IntPtr]::Zero){Click $picker $buttonName}else{[NoticeCloser]::PostMessage($accept,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)|Out-Null};Start-Sleep -Milliseconds 600;if(!$root.Current.IsEnabled -and !$allowWork){throw 'Native selection did not return to main owner'};if(!$allowWork){AssertNoProgress}}
            function SetValueById([string]$id,[string]$value){$element=ById $root $id;if(!$element){throw "Missing input: $id"};([Windows.Automation.ValuePattern]$element.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern)).SetValue($value);Start-Sleep -Milliseconds 100}
            function WaitWork([bool]$expectError=$false){$seenError=$false;for($n=0;$n -lt 240;$n++){foreach($w in (ProcessWindows)){$name=$w.Current.Name;if($name -in @('İşlem tamamlandı','İşlem tamamlanamadı')){if($name -eq 'İşlem tamamlanamadı'){$seenError=$true};$ok=FindNamed $w 'Tamam' ([Windows.Automation.ControlType]::Button);if($ok){([Windows.Automation.InvokePattern]$ok.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()}}};Start-Sleep -Milliseconds 200;$footer=ById $root 'MainFooterStatus';if($footer.Current.Name.StartsWith('Hazır') -and $root.Current.IsEnabled){foreach($w in (ProcessWindows|Where-Object {$_.Current.Name -eq 'İşlem Durumu'})){$state=ById $w 'OperationState';if($state -and $state.Current.Name -eq 'İşlem tamamlanamadı'){$seenError=$true};CloseWindow $w};if($expectError -ne $seenError){throw ('Unexpected operation error state: '+$seenError)};return}};throw 'Operation failed to release busy state within 48 seconds'}
            $fixtures=Join-Path $dir 'picker-fixtures';New-Item -ItemType Directory $fixtures -Force|Out-Null
            SelectTab 'Arama Motoru Yedekleme';Click $root 'Yedekleme / Geri Yükleme Konumunu Seç…';$picker=FindWindow 'Tek şifreli tarayıcı paketini kaydet';Start-Sleep -Seconds 1;AssertNoProgress;CancelNative $picker 'Cancel'
            $result.phase='unified browser backup'
            $chromeRoot=Join-Path $env:LOCALAPPDATA 'Google/Chrome/User Data';$profile=Join-Path $chromeRoot 'Default';New-Item -ItemType Directory $profile -Force|Out-Null
            $book=Join-Path $profile 'Bookmarks';$bookJson='{"version":1,"roots":{"bookmark_bar":{"type":"folder","name":"Bookmarks","children":[{"type":"url","name":"Fixture","url":"https://example.invalid"}]}}}'
            [IO.File]::WriteAllText($book,$bookJson);[IO.File]::WriteAllText((Join-Path $chromeRoot 'Last Version'),'131.0.0.0')
            $csv=Join-Path $fixtures 'official-passwords.csv';[IO.File]::WriteAllText($csv,"name,url,username,password`nFixture,https://example.invalid,synthetic,not-a-real-secret`n")
            Click $root 'Tarayıcıları Listele';Start-Sleep -Milliseconds 300;AssertNoProgress
            $grid=ById $root 'BrowserWizardProfiles'
            foreach($name in @('Yer imleri','Şifreler')){$box=FindNamed $grid $name ([Windows.Automation.ControlType]::CheckBox);if(!$box -or ([Windows.Automation.TogglePattern]$box.GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)).Current.ToggleState -ne [Windows.Automation.ToggleState]::On){throw "Default data checkbox not selected: $name"}}
            $manualHtml=FindNamed $grid 'HTML aktarımı: Chrome / Default' ([Windows.Automation.ControlType]::Button);if($manualHtml -and !$manualHtml.Current.IsOffscreen){throw 'Automatic bookmark profile still exposes manual HTML action'}
            $winPattern=[Windows.Automation.WindowPattern]$root.GetCurrentPattern([Windows.Automation.WindowPattern]::Pattern)
            $winPattern.SetWindowVisualState([Windows.Automation.WindowVisualState]::Normal)
            Start-Sleep -Milliseconds 200
            $transform=[Windows.Automation.TransformPattern]$root.GetCurrentPattern([Windows.Automation.TransformPattern]::Pattern)
            $transform.Resize(950,700);Start-Sleep -Milliseconds 300
            $grid=ById $root 'BrowserWizardProfiles'
            if($grid.Current.BoundingRectangle.Right -gt $root.Current.BoundingRectangle.Right){throw 'Compact browser grid overflows resized window'}
            Screenshot $root 'browser-compact.png'
            $winPattern.SetWindowVisualState([Windows.Automation.WindowVisualState]::Maximized)
            foreach($i in 1..2){SelectTab 'Donanım ve Sürücüler';SelectTab 'Arama Motoru Yedekleme'}
            $result.resizeAndNavigationVerified=$true
            $allBrowser=ById $root 'SelectAll_BrowserWizardRows';$toggle=[Windows.Automation.TogglePattern]$allBrowser.GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern);if($toggle.Current.ToggleState -ne [Windows.Automation.ToggleState]::On){$toggle.Toggle()};$toggle.Toggle()
            $grid=ById $root 'BrowserWizardProfiles'
            $rows=$grid.FindAll($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::DataItem))
            $fixtureRow=$rows|Where-Object {(FindNamed $_ 'Chrome' ([Windows.Automation.ControlType]::Text)) -and (FindNamed $_ 'Default' ([Windows.Automation.ControlType]::Text))}|Select-Object -First 1
            if(!$fixtureRow){throw 'Chrome Default fixture row missing'}
            $rowCheck=ById $fixtureRow 'SelectRow_BrowserWizardRows';([Windows.Automation.TogglePattern]$rowCheck.GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)).Toggle()
            Click $root 'Seçili Tarayıcıları Hazırla';$guide=FindWindow 'Chrome / Default — aktarım adımı';CloseWindow $guide;AssertNoProgress;if(!$root.Current.IsEnabled -or (ProcessWindows|Where-Object {$_.Current.Name -eq 'Resmî şifre CSV dosyasını ekle'})){throw 'Cancelling official export step opened file picker'}
            Click $root 'Seçili Tarayıcıları Hazırla';$guide=FindWindow 'Chrome / Default — aktarım adımı';Click $guide 'Tamam';$picker=FindWindow 'Resmî şifre CSV dosyasını ekle';NativePath $picker $csv 'Open'
            $package=Join-Path $fixtures 'unified-browser.tsbrowser';SetValueById 'BrowserWizardPackagePath' $package
            function SetTestPassword([string]$id,[string]$value){$box=ById $root $id;try{([Windows.Automation.ValuePattern]$box.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern)).SetValue($value)}catch{[NoticeCloser]::SetForegroundWindow([IntPtr]$root.Current.NativeWindowHandle)|Out-Null;$box.SetFocus();[Windows.Forms.SendKeys]::SendWait('^a');[Windows.Forms.SendKeys]::SendWait($value)};Start-Sleep -Milliseconds 100}
            function WizardConsent{([Windows.Automation.TogglePattern](ById $root 'BrowserBackupConsent').GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)).Toggle();Start-Sleep -Milliseconds 150}
            if((ById $root 'BrowserWizardPasswordLabel').Current.Name -ne 'Yedek parolası (en az 8 karakter)'){throw 'Backup password label incorrect'}
            SetTestPassword 'BrowserVaultPassword' '1234567';SetTestPassword 'BrowserVaultRepeat' '1234567';WizardConsent;if((ById $root 'BrowserBackupSave').Current.IsEnabled){throw 'Seven character wizard password accepted'}
            SetTestPassword 'BrowserVaultPassword' '12345678';SetTestPassword 'BrowserVaultRepeat' '12345678';if(([Windows.Automation.TogglePattern](ById $root 'BrowserBackupConsent').GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)).Current.ToggleState -ne [Windows.Automation.ToggleState]::Off){throw 'Password change did not reset wizard consent'}
            $repeatInput=ById $root 'BrowserVaultRepeat';if($repeatInput){$repeatInput.SetFocus()};if(!$repeatInput -or $repeatInput.Current.IsOffscreen){throw 'Backup repeat field should be visible'}
            WizardConsent;if(!(ById $root 'BrowserBackupSave').Current.IsEnabled){throw 'Eight character ready wizard not enabled'}
            Click $root 'Onayla ve Yedekle';WaitWork
            if(!(Test-Path $package) -or [IO.File]::ReadAllText($package).Contains('not-a-real-secret') -or !(ById $root 'BrowserWizardStatus').Current.Name.Contains('2 veri dosyası')){throw 'Unified encrypted bookmark/password package was not produced'}
            $result.phase='unified browser restore'
            [IO.File]::WriteAllText($book,$bookJson.Replace('Fixture','Current'))
            $mode=ById $root 'BrowserWizardMode';([Windows.Automation.ExpandCollapsePattern]$mode.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern)).Expand();Start-Sleep -Milliseconds 150
            $restoreMode=FindNamed ([Windows.Automation.AutomationElement]::RootElement) 'Geri Yükle' ([Windows.Automation.ControlType]::ListItem);if(!$restoreMode){throw 'Restore mode missing'};$bounds=$restoreMode.Current.BoundingRectangle;[NoticeCloser]::SetCursorPos([int]($bounds.X+$bounds.Width/2),[int]($bounds.Y+$bounds.Height/2))|Out-Null;[NoticeCloser]::mouse_event(2,0,0,0,[UIntPtr]::Zero);[NoticeCloser]::mouse_event(4,0,0,0,[UIntPtr]::Zero);Start-Sleep -Milliseconds 200;if((ById $root 'BrowserBackupSave').Current.Name -ne 'Planı Göster ve Geri Yükle'){throw 'Restore mode did not actually change'}
            if(!(FindNamed $root 'Yedekleme / Geri Yükleme Konumunu Seç…' ([Windows.Automation.ControlType]::Button))){throw 'Restore destination label did not change'}
            function FocusWizardPassword {
              $settings=ById $root 'BrowserWizardSettings';$candidate=$null;$scroll=$null
              if($settings -and $settings.TryGetCurrentPattern([Windows.Automation.ScrollPattern]::Pattern,[ref]$candidate)){$scroll=[Windows.Automation.ScrollPattern]$candidate;$script:WizardScroll=$scroll;if($scroll.Current.VerticallyScrollable){$scroll.SetScrollPercent(-1,0)}}
              for($attempt=0;$attempt -lt 30;$attempt++){$box=ById $root 'BrowserVaultPassword';if($box -and !$box.Current.IsOffscreen){$box.SetFocus();Start-Sleep -Milliseconds 200;return};if(!$scroll){throw 'Settings scroll container missing'};$scroll.Scroll([Windows.Automation.ScrollAmount]::NoAmount,[Windows.Automation.ScrollAmount]::SmallIncrement);Start-Sleep -Milliseconds 100}
              throw 'Password input not visible after scrolling settings'
            }
            function SelectWizardMode([string]$name){$mode=ById $root 'BrowserWizardMode';$mode.SetFocus();([Windows.Automation.ExpandCollapsePattern]$mode.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern)).Expand();Start-Sleep -Milliseconds 150;$item=FindNamed ([Windows.Automation.AutomationElement]::RootElement) $name ([Windows.Automation.ControlType]::ListItem);if(!$item){throw "Missing mode $name"};$b=$item.Current.BoundingRectangle;[NoticeCloser]::SetCursorPos([int]($b.X+$b.Width/2),[int]($b.Y+$b.Height/2))|Out-Null;[NoticeCloser]::mouse_event(2,0,0,0,[UIntPtr]::Zero);[NoticeCloser]::mouse_event(4,0,0,0,[UIntPtr]::Zero);Start-Sleep -Milliseconds 150;FocusWizardPassword}
            FocusWizardPassword
            foreach($iteration in 1..2){
              if((ById $root 'BrowserWizardPasswordLabel').Current.Name -ne 'Yedek oluştururken belirlediğiniz parolayı girin'){throw 'Restore password label incorrect'}
              $repeatInput=ById $root 'BrowserVaultRepeat';if($repeatInput -and !$repeatInput.Current.IsOffscreen){throw 'Restore mode still exposes repeat input'}
              SelectWizardMode 'Yedek Oluştur'
              if((ById $root 'BrowserWizardPasswordLabel').Current.Name -ne 'Yedek parolası (en az 8 karakter)'){throw ('Backup label not restored: '+(ById $root 'BrowserWizardPasswordLabel').Current.Name+'; action: '+(ById $root 'BrowserBackupSave').Current.Name)}
              (ById $root 'BrowserVaultRepeat').SetFocus();if((ById $root 'BrowserVaultRepeat').Current.IsOffscreen){throw 'Repeat field not restored in backup mode'}
              SelectWizardMode 'Geri Yükle'
            }
            $result.modePasswordPresentationVerified=$true
            $replace=ById $root 'BrowserWizardReplace';([Windows.Automation.TogglePattern]$replace.GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)).Toggle()
            SetTestPassword 'BrowserVaultPassword' '12345678';WizardConsent;Click $root 'Planı Göster ve Geri Yükle';$confirm=FindWindow 'İşlem onayı';Click $confirm 'Vazgeç';WaitWork
            if(![IO.File]::ReadAllText($book).Contains('Current')){throw 'Cancelled wizard restore changed browser profile'}
            SetTestPassword 'BrowserVaultPassword' '12345678';WizardConsent;Click $root 'Planı Göster ve Geri Yükle';$confirm=FindWindow 'İşlem onayı';Click $confirm 'Devam Et';WaitWork
            $staged=Join-Path $env:LOCALAPPDATA 'TeknikServisPRO/TarayiciAktarim/Chrome/Default/Sifreler.csv'
            if([IO.File]::ReadAllText($book) -ne $bookJson -or !(Test-Path $staged) -or (Get-FileHash $staged).Hash -ne (Get-FileHash $csv).Hash){throw 'Unified restore did not restore exact bookmark/official CSV fixture'}
            if(!(ById $root 'BrowserWizardStatus').Current.Name.Contains('henüz tamamlanmadı')){throw 'Manual browser import requirement was falsely presented as complete'}
            $result.browserWizard=[ordered]@{unifiedPackage=$true;minimumEight=$true;consentReset=$true;restorePlanCancel=$true;bookmarkRestoreExact=$true;passwordStagingExact=$true;manualImportReported=$true}
            Screenshot $root 'browser-wizard.png'
            $result.pickerOnlyNoProgress=$true;$result.defaultSelectionsVerified=$true;$result.automaticBookmarkActionVerified=$true
            $result.hardwareScope='UI-only password label/repeat visibility and mode switching, with synthetic backup/restore regression. Unchanged 34 package unit checks not repeated. Targeted browser UI regression: compact layout, default data selection, picker cancel, encrypted package, consent and native restore. Unrelated Format tests were not repeated. No customer files, printer, network or credential operation performed.'
            $app.Refresh();$result.mainWindowEnabled=$root.Current.IsEnabled
            if(!$root.Current.IsEnabled){throw 'Main window remained disabled after dialogs'}
            if(![NoticeCloser]::PostMessage([IntPtr]$root.Current.NativeWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)){throw 'Main window close request failed'}
            if (!$app.WaitForExit(10000)) {
              $windows=[Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id))
              $result.remainingWindows=@($windows|ForEach-Object {$_.Current.Name})
              throw 'Application did not close normally'
            }
            if([IO.File]::ReadAllText((Join-Path $folder 'Data/fixture-preserve.txt')) -ne 'synthetic-keep-data' -or [IO.File]::ReadAllText((Join-Path $folder 'Drivers/fixture-preserve.txt')) -ne 'synthetic-keep-drivers'){throw 'Existing Data/Drivers sentinel changed'}
            $result.existingDataDriversPreserved=$true
            $result.applicationExitCode=$app.ExitCode
            if ($app.ExitCode -ne 0) { throw 'Application exit code was not zero' }
          } catch { $result.errors += $_.Exception.Message;$result.failureStack=$_.ScriptStackTrace;$result.failurePosition=$_.InvocationInfo.PositionMessage;try{if($root){Screenshot $root 'failure1100.png'}}catch{} } finally {
            if ($app -and !$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            try { Get-MpThreatDetection | ConvertTo-Json -Depth 8 | Set-Content "$dir/threat-detections.json" } catch {}
            $result | ConvertTo-Json -Depth 8 | Tee-Object "$dir/result.json"


          }
          if ($result.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$result.startupVerified -or $result.errors.Count) { exit 1 }
      - name: Publish only after verified scan and startup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          $r=Get-Content "$dir/result.json" | ConvertFrom-Json
          if($r.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$r.startupVerified -or $r.errors.Count){throw 'Review gate failed'}
          $exe=Join-Path $dir 'application/TeknikServis_PRO.exe'
          $legacy=Join-Path $dir 'TeknikAsistanim_PRO.exe';Copy-Item $exe $legacy
          gh release create v1.10.4 --draft --title 'Teknik Servis PRO 1.10.4' --notes-file binaries/release-notes.md
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed; no existing release overwritten'}
          gh release upload v1.10.4 $exe $legacy "$dir/TeknikServis_PRO_1.10.4_EXE.zip" "$dir/result.json"
          if($LASTEXITCODE -ne 0){throw 'Upload failed'}
          gh api "repos/$env:GH_REPO/releases?per_page=30" > "$dir/releases.json"
          $release=(Get-Content "$dir/releases.json" | ConvertFrom-Json) | Where-Object tag_name -eq 'v1.10.4'
          foreach($name in @('TeknikServis_PRO.exe','TeknikAsistanim_PRO.exe')){
            $a=$release.assets | Where-Object name -eq $name
            if($a.digest.ToLowerInvariant() -ne ('sha256:'+$r.exeSha256)){throw 'Uploaded EXE digest mismatch'}
          }
          $z=$release.assets | Where-Object name -eq 'TeknikServis_PRO_1.10.4_EXE.zip'
          if($z.digest.ToLowerInvariant() -ne ('sha256:'+$r.zipSha256)){throw 'Uploaded ZIP digest mismatch'}
          Write-Output 'Verified draft ready; publication follows visual screenshot review.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-original-archive-and-startup
          path: |
            ${{ runner.temp }}/exact-archive-review/result.json
            ${{ runner.temp }}/exact-archive-review/scan-*.txt
            ${{ runner.temp }}/exact-archive-review/threat-detections.json
            ${{ runner.temp }}/exact-archive-review/*.png
            ${{ runner.temp }}/browser-package-results.txt

          retention-days: 14
