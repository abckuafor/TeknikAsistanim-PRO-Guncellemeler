name: Review and publish 1.9.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review190.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact EXE and ZIP, verify unified status window
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          New-Item -ItemType Directory $dir -Force | Out-Null
          $result=[ordered]@{verdict='NOT_SCANNED'; errors=@(); exeExecuted=$false; startupVerified=$false}
          $app=$null
          try {
            if ((Get-Service WinDefend).Status -ne 'Running') { Start-Service WinDefend -ErrorAction Stop }
            Update-MpSignature -ErrorAction Stop
            $status=Get-MpComputerStatus
            $result.defenderVersion=$status.AMProductVersion
            $result.signatureVersion=$status.AntivirusSignatureVersion
            $result.signatureUpdatedUtc=$status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o')
            if (!$status.AMServiceEnabled -or $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-3)) { throw 'Defender or current signatures unavailable' }
            $folder=Join-Path $dir 'application'; New-Item -ItemType Directory $folder -Force | Out-Null
            $exe=Join-Path $folder 'TeknikServis_PRO.exe'
            $stream=[IO.File]::Create($exe)
            try { Get-ChildItem 'binaries/parts/*.part' | Sort-Object Name | ForEach-Object { $f=[IO.File]::OpenRead($_.FullName);try{$f.CopyTo($stream)}finally{$f.Dispose()} } } finally { $stream.Dispose() }
            $expected=((Get-Content 'binaries/SHA256.txt') -split ' ')[0].ToLowerInvariant()
            $result.exeSha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if($result.exeSha256 -ne $expected){throw 'EXE hash mismatch'}
            $zip=Join-Path $dir 'TeknikServis_PRO_1.9.0_EXE.zip'
            Compress-Archive $exe $zip
            $result.zipSha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $engine=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $engine.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object "$dir/scan-exe.txt"
            $result.exeScanExitCode=$LASTEXITCODE
            if($LASTEXITCODE -ne 0){throw 'EXE scan did not succeed'}
            & $engine.FullName -Scan -ScanType 3 -File $zip -DisableRemediation 2>&1 | Tee-Object "$dir/scan-original-zip.txt"
            $result.scanExitCode=$LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { $result.verdict='DETECTED_OR_SCAN_ERROR'; throw 'Original archive scan did not succeed' }
            $result.verdict='NO_DETECTION_IN_THIS_ENVIRONMENT'
            $app=Start-Process $exe -WorkingDirectory $folder -PassThru
            $result.exeExecuted=$true
            for ($i=0;$i -lt 30;$i++) {
              Start-Sleep -Seconds 1; $app.Refresh()
              if ($app.HasExited) { throw "Application exited before startup verification: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -like 'Teknik Servis PRO 1.9.0*') { $result.startupVerified=$true; $result.windowTitle=$app.MainWindowTitle; break }
            }
            if (!$result.startupVerified) { throw "Main WPF window not verified: $($app.MainWindowTitle)" }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            Add-Type 'using System; using System.Runtime.InteropServices; public static class NoticeCloser { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window,uint message,IntPtr wParam,IntPtr lParam); [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr window,int index); }'
            $scope=[Windows.Automation.TreeScope]::Descendants
            function FindNamed($parent,[string]$name,$kind) {
              $c=[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,$name),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,$kind))
              return $parent.FindFirst($scope,$c)
            }
            function FindWindow([string]$name) {
              $c=[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,$name),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id))
              for($j=0;$j -lt 120;$j++){$found=[Windows.Automation.AutomationElement]::RootElement.FindFirst($scope,$c);if($found){return $found};Start-Sleep -Milliseconds 250}
              throw "Dialog not found: $name"
            }
            function Click($parent,[string]$name) {
              $b=FindNamed $parent $name ([Windows.Automation.ControlType]::Button)
              if(!$b){throw "Button missing: $name"}
              ([Windows.Automation.InvokePattern]$b.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            }
            function CheckModern($window) {
              $close=$window.FindFirst($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'DialogClose'))
              if(!$close){throw 'Custom dialog close control missing'}
              $style=[NoticeCloser]::GetWindowLong([IntPtr]$window.Current.NativeWindowHandle,-16)
              $result.customChromeVerified=$true
            }
            $root=[Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            function ById($parent,[string]$id){return $parent.FindFirst($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,$id))}
            Add-Type -AssemblyName System.Drawing
            function Screenshot($window,[string]$name) {
              $bounds=$window.Current.BoundingRectangle
              $image=[Drawing.Bitmap]::new([int]$bounds.Width,[int]$bounds.Height);$graphics=[Drawing.Graphics]::FromImage($image);$graphics.CopyFromScreen([int]$bounds.X,[int]$bounds.Y,0,0,$image.Size)
              $image.Save((Join-Path $dir $name),[Drawing.Imaging.ImageFormat]::Png);$graphics.Dispose();$image.Dispose()
            }
            function CloseWindow($window){[NoticeCloser]::PostMessage([IntPtr]$window.Current.NativeWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)|Out-Null;Start-Sleep -Milliseconds 300}
            function WaitDone($window){for($j=0;$j -lt 480;$j++){if((ById $window 'OperationState').Current.Name -and (ById $window 'OperationState').Current.Name -ne 'İşlem devam ediyor'){return};Start-Sleep -Milliseconds 250};throw 'Bounded read-only operation did not finish'}
            $tab=FindNamed $root 'Yazıcı, Barkod, Tarayıcı' ([Windows.Automation.ControlType]::TabItem)
            ([Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 500
            $watch=ById $root 'DeviceWatchToggle'
            for($i=0;$i -lt 30 -and $watch.Current.Name -notlike '*açık*';$i++){Start-Sleep -Seconds 1}
            if($watch.Current.Name -notlike '*açık*'){throw 'Automatic device arrival watcher did not start'}
            $result.automaticDeviceWatcherStarted=$true
            $quick=ById $root 'QuickBarcodeTest';if(!$quick){throw 'Direct barcode shortcut missing'}
            ([Windows.Automation.InvokePattern]$quick.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $reader=FindWindow 'Barkod Okutma Testi';if(!(ById $reader 'ReaderInput')){throw 'Barcode input unavailable'};CheckModern $reader;Screenshot $reader 'peripheral-reader.png';CloseWindow $reader
            $result.directBarcodeWindowVerified=$true
            Click $root 'Nokta Vuruşlu Yazıcı';$dot=FindWindow 'Nokta vuruşlu yazıcı ayarları';CheckModern $dot;CloseWindow $dot;$result.dotMatrixGuideVerified=$true
            Click $root 'Alternatif Çözüm Kaynakları';$alt=FindWindow 'Alternatif sürücü ve çözüm kaynakları';CheckModern $alt;CloseWindow $alt;$result.alternativeEvidenceWindowVerified=$true
            Screenshot $root 'main-status.png'
            Click $root 'Cihazları Listele';$status=FindWindow 'İşlem Durumu';WaitDone $status;CloseWindow $status
            $history=FindNamed $root 'Bilgisayar Geçmişi' ([Windows.Automation.ControlType]::TabItem)
            ([Windows.Automation.SelectionItemPattern]$history.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 400
            $open=ById $root 'OpenComputerHistory';if(!$open){throw 'Current computer history row not created'}
            ([Windows.Automation.InvokePattern]$open.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $hist=FindWindow 'Seçili bilgisayarın servis geçmişi';Click $hist 'Bilgisayar Adını Değiştir';$rename=FindWindow 'Bilgisayar adını değiştir';CheckModern $rename
            ([Windows.Automation.ValuePattern](ById $rename 'NewComputerName').GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern)).SetValue('INVALID NAME')
            Click $rename 'Yeni Adı Kaydet';Start-Sleep -Milliseconds 200
            if(!(ById $rename 'NewComputerName')){throw 'Invalid name unexpectedly closed rename form'}
            $result.renameFormAndInvalidNameVerified=$true;Screenshot $rename 'rename190.png';CloseWindow $rename;CloseWindow $hist
            $tab=FindNamed $root 'Yazıcı, Barkod, Tarayıcı' ([Windows.Automation.ControlType]::TabItem)
            ([Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 200
            $tab=ById $root 'ScannerToolsTab';([Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 200
            if(!(ById $root 'TwainScan') -or !(ById $root 'DocumentOcr')){throw 'TWAIN/OCR tools missing'}
            Click $root 'TWAIN ile Tara'
            $allScope=[Windows.Automation.TreeScope]::Descendants
            $twain=$null
            for($i=0;$i -lt 100;$i++){$twain=[Windows.Automation.AutomationElement]::RootElement.FindFirst($allScope,[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'TWAIN ile belge tara'),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window)));if($twain){break};Start-Sleep -Milliseconds 200}
            if(!$twain){throw 'Isolated TWAIN worker window not found'}
            Start-Sleep -Seconds 2;Screenshot $twain 'twain190.png';Click $twain 'Bitir / Kapat'
            $status=FindWindow 'İşlem Durumu';WaitDone $status;CloseWindow $status
            $twainResult=Get-ChildItem (Join-Path $folder 'Data/Taramalar/TWAIN/*/sonuc.json')|Select-Object -First 1
            if(!$twainResult){throw 'TWAIN worker result not received'}
            $twainRecord=Get-Content $twainResult.FullName -Raw|ConvertFrom-Json
            if($twainRecord.Verified){throw 'Unexpected physical TWAIN success on no-device fixture'}
            $result.twainWorkerAndNoDeviceResultVerified=$true
            # A generated document exercises Windows OCR if the VM has a recognizer language.
            $fixture=Join-Path $dir 'ocr190.png';$bmp=[Drawing.Bitmap]::new(1500,240);$g=[Drawing.Graphics]::FromImage($bmp);$g.Clear([Drawing.Color]::White)
            $font=[Drawing.Font]::new('Arial',56);$g.DrawString('TEKNIK SERVIS PRO 12345',$font,[Drawing.Brushes]::Black,20,50);$bmp.Save($fixture,[Drawing.Imaging.ImageFormat]::Png);$font.Dispose();$g.Dispose();$bmp.Dispose()
            Click $root 'Belgeyi Metne Çevir (OCR)';$fileDialog=FindWindow 'Metne çevrilecek belge görüntüsünü seçin'
            $edits=$fileDialog.FindAll($scope,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Edit))
            $set=$false
            foreach($edit in $edits){if($edit.Current.AutomationId -in @('1148','1001')){([Windows.Automation.ValuePattern]$edit.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern)).SetValue($fixture);$set=$true;break}}
            if(!$set){throw 'File name edit not found in native OCR picker'}
            Click $fileDialog 'Open';$status=FindWindow 'İşlem Durumu';WaitDone $status
            $logs=@(Get-ChildItem (Join-Path $folder 'Data/Logs/*.json')|Sort-Object LastWriteTime -Descending)
            $ocrRecord=$null
            foreach($log in $logs){$v=Get-Content $log.FullName -Raw|ConvertFrom-Json;if($v.OperationName -like '*OCR*' -or $v.OperationName -eq 'Hata'){$ocrRecord=$v;break}}
            if($ocrRecord -and $ocrRecord.Verified -and $ocrRecord.StandardOutput -like '*12345*'){$result.nativeOcrRecognizedGeneratedDocument=$true}
            else{$result.nativeOcrRecognizedGeneratedDocument=$false;$result.ocrEnvironmentResult=(ById $status 'OperationState').Current.Name;$result.ocrDetail=($logs|Select-Object -First 1|Get-Content -Raw|ConvertFrom-Json).Message}
            Screenshot $status 'ocr190.png';CloseWindow $status
            $result.hardwareScope='Windows virtual desktop: new automatic watcher, direct barcode form, dot matrix and evidence panels, invalid rename rejection, isolated TWAIN no-device response and generated OCR document. No physical device, actual rename, activation, vendor install, printing or network-changing operation was performed.'
            $app.Refresh();$result.mainWindowEnabled=$root.Current.IsEnabled
            if(!$root.Current.IsEnabled){throw 'Main window remained disabled after dialogs'}
            if(![NoticeCloser]::PostMessage([IntPtr]$root.Current.NativeWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)){throw 'Main window close request failed'}
            if (!$app.WaitForExit(10000)) {
              $windows=[Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id))
              $result.remainingWindows=@($windows|ForEach-Object {$_.Current.Name})
              throw 'Application did not close normally'
            }
            $result.applicationExitCode=$app.ExitCode
            if ($app.ExitCode -ne 0) { throw 'Application exit code was not zero' }
          } catch { $result.errors += $_.Exception.Message } finally {
            if ($app -and !$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            try { Get-MpThreatDetection | ConvertTo-Json -Depth 8 | Set-Content "$dir/threat-detections.json" } catch {}
            $result | ConvertTo-Json -Depth 8 | Tee-Object "$dir/result.json"


          }
          if ($result.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$result.startupVerified -or $result.errors.Count) { exit 1 }
      - name: Publish only after verified scan and startup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          $r=Get-Content "$dir/result.json" | ConvertFrom-Json
          if($r.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$r.startupVerified -or $r.errors.Count){throw 'Review gate failed'}
          $exe=Join-Path $dir 'application/TeknikServis_PRO.exe'
          $legacy=Join-Path $dir 'TeknikAsistanim_PRO.exe';Copy-Item $exe $legacy
          gh release create v1.9.0 --draft --title 'Teknik Servis PRO 1.9.0' --notes-file binaries/release-notes.md
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed; no existing release overwritten'}
          gh release upload v1.9.0 $exe $legacy "$dir/TeknikServis_PRO_1.9.0_EXE.zip" "$dir/result.json"
          if($LASTEXITCODE -ne 0){throw 'Upload failed'}
          gh api "repos/$env:GH_REPO/releases?per_page=30" > "$dir/releases.json"
          $release=(Get-Content "$dir/releases.json" | ConvertFrom-Json) | Where-Object tag_name -eq 'v1.9.0'
          foreach($name in @('TeknikServis_PRO.exe','TeknikAsistanim_PRO.exe')){
            $a=$release.assets | Where-Object name -eq $name
            if($a.digest.ToLowerInvariant() -ne ('sha256:'+$r.exeSha256)){throw 'Uploaded EXE digest mismatch'}
          }
          $z=$release.assets | Where-Object name -eq 'TeknikServis_PRO_1.9.0_EXE.zip'
          if($z.digest.ToLowerInvariant() -ne ('sha256:'+$r.zipSha256)){throw 'Uploaded ZIP digest mismatch'}
          Write-Output 'Verified draft ready; publication follows visual screenshot review.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-original-archive-and-startup
          path: |
            ${{ runner.temp }}/exact-archive-review/result.json
            ${{ runner.temp }}/exact-archive-review/scan-*.txt
            ${{ runner.temp }}/exact-archive-review/threat-detections.json
            ${{ runner.temp }}/exact-archive-review/operation-status.png
            ${{ runner.temp }}/exact-archive-review/main-status.png
            ${{ runner.temp }}/exact-archive-review/peripheral-reader.png
            ${{ runner.temp }}/exact-archive-review/rename190.png
            ${{ runner.temp }}/exact-archive-review/twain190.png
            ${{ runner.temp }}/exact-archive-review/ocr190.png
          retention-days: 14
