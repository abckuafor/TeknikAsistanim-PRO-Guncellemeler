name: Publish portable EXE
on:
  push:
    branches: [main]
    paths: ['binaries/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd binaries
          version=$(cat version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo 'This version is already published; no files changed.'
            exit 0
          fi
          cat parts/*.part > TeknikServis_PRO.exe
          sha256sum --check SHA256.txt
          expected=$(sha256sum TeknikServis_PRO.exe | cut -d' ' -f1)
          cp TeknikServis_PRO.exe TeknikAsistanim_PRO.exe
          zip "TeknikServis_PRO_${version}_EXE.zip" TeknikServis_PRO.exe
          unzip -p "TeknikServis_PRO_${version}_EXE.zip" TeknikServis_PRO.exe | sha256sum | grep -q "$expected"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft-state" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/draft-state")" != "true" ]; then
              echo 'This version is already published; existing assets are preserved.'
              exit 1
            fi
          else
            gh release create "$tag" --draft --title "Teknik Servis PRO $version" --notes-file release-notes.md
          fi
          gh release edit "$tag" --notes-file release-notes.md
          gh release upload "$tag" TeknikServis_PRO.exe TeknikAsistanim_PRO.exe "TeknikServis_PRO_${version}_EXE.zip" --clobber
          release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/release-info.json"
          python3 - "$RUNNER_TEMP/release-info.json" "$expected" <<'PY'
          import json,sys
          release=json.load(open(sys.argv[1])); expected='sha256:'+sys.argv[2]
          for name in ['TeknikServis_PRO.exe','TeknikAsistanim_PRO.exe']:
              assets=[a for a in release['assets'] if a['name']==name]
              assert len(assets)==1 and assets[0]['digest'].lower()==expected.lower(),name+' digest mismatch'
          PY
          gh release edit "$tag" --draft=false --latest
