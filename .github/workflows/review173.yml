name: Review and publish 1.7.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review173.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact withdrawn archive then check startup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          New-Item -ItemType Directory $dir -Force | Out-Null
          $result=[ordered]@{verdict='NOT_SCANNED'; errors=@(); exeExecuted=$false; startupVerified=$false}
          $app=$null
          try {
            if ((Get-Service WinDefend).Status -ne 'Running') { Start-Service WinDefend -ErrorAction Stop }
            Update-MpSignature -ErrorAction Stop
            $status=Get-MpComputerStatus
            $result.defenderVersion=$status.AMProductVersion
            $result.signatureVersion=$status.AntivirusSignatureVersion
            $result.signatureUpdatedUtc=$status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o')
            if (!$status.AMServiceEnabled -or $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-3)) { throw 'Defender or current signatures unavailable' }
            $folder=Join-Path $dir 'application'; New-Item -ItemType Directory $folder -Force | Out-Null
            $exe=Join-Path $folder 'TeknikServis_PRO.exe'
            $stream=[IO.File]::Create($exe)
            try { Get-ChildItem 'binaries/parts/*.part' | Sort-Object Name | ForEach-Object { $f=[IO.File]::OpenRead($_.FullName);try{$f.CopyTo($stream)}finally{$f.Dispose()} } } finally { $stream.Dispose() }
            $expected=((Get-Content 'binaries/SHA256.txt') -split ' ')[0].ToLowerInvariant()
            $result.exeSha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if($result.exeSha256 -ne $expected){throw 'EXE hash mismatch'}
            $zip=Join-Path $dir 'TeknikServis_PRO_1.7.3_EXE.zip'
            Compress-Archive $exe $zip
            $result.zipSha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $engine=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $engine.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object "$dir/scan-exe.txt"
            $result.exeScanExitCode=$LASTEXITCODE
            if($LASTEXITCODE -ne 0){throw 'EXE scan did not succeed'}
            & $engine.FullName -Scan -ScanType 3 -File $zip -DisableRemediation 2>&1 | Tee-Object "$dir/scan-original-zip.txt"
            $result.scanExitCode=$LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { $result.verdict='DETECTED_OR_SCAN_ERROR'; throw 'Original archive scan did not succeed' }
            $result.verdict='NO_DETECTION_IN_THIS_ENVIRONMENT'
            $app=Start-Process $exe -WorkingDirectory $folder -PassThru
            $result.exeExecuted=$true
            for ($i=0;$i -lt 30;$i++) {
              Start-Sleep -Seconds 1; $app.Refresh()
              if ($app.HasExited) { throw "Application exited before startup verification: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -like 'Teknik Servis PRO 1.7.3*') { $result.startupVerified=$true; $result.windowTitle=$app.MainWindowTitle; break }
            }
            if (!$result.startupVerified) { throw "Main WPF window not verified: $($app.MainWindowTitle)" }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $root=[Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $tab=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'İnternet Sorunları'))
            if(!$tab){throw 'Network tab missing'}
            ([Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)).Select();Start-Sleep -Milliseconds 300
            $button=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Wi-Fi Hızını Kontrol Et'))
            if(!$button){throw 'Wi-Fi speed button missing'}
            ([Windows.Automation.InvokePattern]$button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $completion=$null
            $condition=[Windows.Automation.AndCondition]::new([Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'İşlem tamamlandı'),[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window))
            for($i=0;$i -lt 40;$i++){$completion=[Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Descendants,$condition);if($completion){break};Start-Sleep -Seconds 1}
            if(!$completion){throw 'Wi-Fi information command did not complete'}
            Add-Type 'using System; using System.Runtime.InteropServices; public static class NoticeCloser { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window,uint message,IntPtr wParam,IntPtr lParam); }'
            if($completion.Current.ProcessId -ne $app.Id){throw 'Completion owner mismatch'}
            if(![NoticeCloser]::PostMessage([IntPtr]$completion.Current.NativeWindowHandle,0x0111,[IntPtr]1,[IntPtr]::Zero)){throw 'Cannot acknowledge completion'}
            Start-Sleep -Milliseconds 500;$result.wifiReadCommandCompleted=$true
            $texts=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Text))
            $result.wifiDisplay=@($texts|ForEach-Object {$_.Current.Name}|Where-Object {$_ -like '*kablosuz bağlantı hızı ölçülmüş sayılmaz*' -or $_ -like '*Wi-Fi alım bağlantı hızı*' -or $_ -like '*Windows*tek bağlantı hızı*'})
            $sampleButton=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'İnternet Hız Örneği (10 MB)'))
            if(!$sampleButton){throw 'Speed sample button missing'}
            ([Windows.Automation.InvokePattern]$sampleButton.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $done=$null
            for($i=0;$i -lt 35;$i++){
              $approval=[Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'İşlem onayı'))
              if($approval){throw 'Speed sample unexpectedly requested approval'}
              $done=[Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Descendants,$condition)
              if($done){break};Start-Sleep -Seconds 1
            }
            if(!$done){throw 'Speed sample did not complete in bounded time'}
            if($done.Current.ProcessId -ne $app.Id){throw 'Speed sample completion owner mismatch'}
            if(![NoticeCloser]::PostMessage([IntPtr]$done.Current.NativeWindowHandle,0x0111,[IntPtr]1,[IntPtr]::Zero)){throw 'Cannot acknowledge sample completion'}
            Start-Sleep -Milliseconds 500
            $sampleText=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'InternetSampleResult'))
            if(!$sampleText){throw 'Speed sample result missing'}
            $result.sampleWithoutApproval=$true;$result.sampleDisplay=$sampleText.Current.Name
            $result.sampleDownloadCompleted=($sampleText.Current.Name -match '^10 MB veri,.*yaklaşık')
            $app.Refresh();$result.mainWindowEnabled=$root.Current.IsEnabled
            if(!$root.Current.IsEnabled){throw 'Main window remained disabled after dialogs'}
            if(![NoticeCloser]::PostMessage([IntPtr]$root.Current.NativeWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)){throw 'Main window close request failed'}
            if (!$app.WaitForExit(10000)) {
              $windows=[Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$app.Id))
              $result.remainingWindows=@($windows|ForEach-Object {$_.Current.Name})
              throw 'Application did not close normally'
            }
            $result.applicationExitCode=$app.ExitCode
            if ($app.ExitCode -ne 0) { throw 'Application exit code was not zero' }
          } catch { $result.errors += $_.Exception.Message } finally {
            if ($app -and !$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            try { Get-MpThreatDetection | ConvertTo-Json -Depth 8 | Set-Content "$dir/threat-detections.json" } catch {}
            $result | ConvertTo-Json -Depth 8 | Tee-Object "$dir/result.json"


          }
          if ($result.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$result.startupVerified -or $result.errors.Count) { exit 1 }
      - name: Publish only after verified scan and startup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'exact-archive-review'
          $r=Get-Content "$dir/result.json" | ConvertFrom-Json
          if($r.verdict -ne 'NO_DETECTION_IN_THIS_ENVIRONMENT' -or !$r.startupVerified -or $r.errors.Count){throw 'Review gate failed'}
          $exe=Join-Path $dir 'application/TeknikServis_PRO.exe'
          $legacy=Join-Path $dir 'TeknikAsistanim_PRO.exe';Copy-Item $exe $legacy
          gh release create v1.7.3 --draft --title 'Teknik Servis PRO 1.7.3' --notes-file binaries/release-notes.md
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed; no existing release overwritten'}
          gh release upload v1.7.3 $exe $legacy "$dir/TeknikServis_PRO_1.7.3_EXE.zip" "$dir/result.json"
          if($LASTEXITCODE -ne 0){throw 'Upload failed'}
          gh api "repos/$env:GH_REPO/releases?per_page=30" > "$dir/releases.json"
          $release=(Get-Content "$dir/releases.json" | ConvertFrom-Json) | Where-Object tag_name -eq 'v1.7.3'
          foreach($name in @('TeknikServis_PRO.exe','TeknikAsistanim_PRO.exe')){
            $a=$release.assets | Where-Object name -eq $name
            if($a.digest.ToLowerInvariant() -ne ('sha256:'+$r.exeSha256)){throw 'Uploaded EXE digest mismatch'}
          }
          $z=$release.assets | Where-Object name -eq 'TeknikServis_PRO_1.7.3_EXE.zip'
          if($z.digest.ToLowerInvariant() -ne ('sha256:'+$r.zipSha256)){throw 'Uploaded ZIP digest mismatch'}
          gh release edit v1.7.3 --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'Publication failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-original-archive-and-startup
          path: |
            ${{ runner.temp }}/exact-archive-review/result.json
            ${{ runner.temp }}/exact-archive-review/scan-*.txt
            ${{ runner.temp }}/exact-archive-review/threat-detections.json
          retention-days: 14
